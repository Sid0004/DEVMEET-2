name: Backend Automated Tests CI

on:
  push:
    branches: [ "main", "master", "dev", "develop" ]
  pull_request:
    branches: [ "main", "master", "dev", "develop" ]

jobs:
  test:
    name: Run API & Unit Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install backend dependencies
        run: npm install

      - name: Run automated test suite
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/devmeet_test_automation
          ACCESS_TOKEN_SECRET: ci-access-token-secret-test-key-12345
          REFRESH_TOKEN_SECRET: ci-refresh-token-secret-test-key-12345
          ACCESS_TOKEN_EXPIRY: 1d
          REFRESH_TOKEN_EXPIRY: 10d
          GOOGLE_CLIENT_ID: ci-google-client-id-test
          GITHUB_CLIENT_ID: ci-github-client-id-test
          GITHUB_CLIENT_SECRET: ci-github-client-secret-test
